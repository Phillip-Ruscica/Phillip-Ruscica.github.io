mini-projects:

  - title: Immersive Virtual Reality Wainfleet Quarry Field Experience
    gif: assets/img/proj_wainfleet_vr.jpg
    event: EESB15 Earth History
    team: <u>Phillip Ruscica</u>, Heidi Daxberger, George Arhonditsis.
    timeline: 2025 - ongoing
    funding: UTSC Departmental Research Fund, UTSC PIE Fund, NSERC (G. Arhonditsis), LEAF Impact Grant 2026-2029
    post: https://www.utsc.utoronto.ca/labs/immersive-tech/research/
    description: An immersive VR field trip that places students in a digital replica of the Wainfleet Quarry, built from photogrammetry models. Students use a virtual camera, map, ruler and compass to identify and record fossils, joints and glacial landforms, with real-time observation logging and exportable datasets for assessment. It gives students practice with core fieldwork skills before or alongside the physical trip.

  - title: Oceanfloor VR App
    event: EESB15 Earth History, EESB20
    team: Heidi Daxberger, Nahin Kadery, <u>Phillip Ruscica</u>.
    timeline: V1 2025 - ongoing
    funding: LEAF Impact Grant 2026-2029
    post: https://www.utsc.utoronto.ca/labs/immersive-tech/research/
    description: An ocean-floor environment organized by depth, from near shore and shallow marine to deep marine and abyssal. Students use levers to see how sunlight, energy level, grain size, pressure and temperature change with depth, and which organisms live in each setting.

  - title: Crystals VR App
    gif: assets/img/proj_crystals_vr.jpg
    event: EESB19 Mineralogy, CHMB31 Inorganic Chemistry
    team: Heidi Daxberger, Alen Hadzovic, Alexander Nicholson, Shivanshi Gupta, <u>Phillip Ruscica</u>.
    timeline: V1 2023 - 2025, V2 2025 - ongoing
    funding: LEAF Impact Grant 2026-2029
    post: https://www.utsc.utoronto.ca/labs/immersive-tech/research/
    description: A VR lab where students handle true 3D crystal lattices of real substances such as halite and fluorite. They can grab structures, toggle individual ions, measure unit-cell angles with a protractor tool, and answer knowledge-check questions, making atomic-scale crystallography something they can see and move through.

  - title: Fossils VR App
    gif: assets/img/proj_fossils_vr.jpg
    event: EESB15 Earth History, EESB20
    status: prototype
    team: Heidi Daxberger, Nahin Kadery, <u>Phillip Ruscica</u>.
    timeline: V1 2025 - ongoing
    funding: LEAF Impact Grant 2026-2029
    post: https://www.utsc.utoronto.ca/labs/immersive-tech/research/
    description: A prototype in which students inspect 3D models of fossilized marine invertebrates alongside living counterparts, with classification information, time ranges and organism characteristics for each. An in-app browser lets students complete Quercus quizzes for ungraded and graded evaluation.

  - title: VR Agriculture
    event: EESD06, EESD31, EESB03
    team: Tanzina Mohsin, Phanikarin Radhakrishnan, Nirusha Thavarajah, Nahin Kadery, <u>Phillip Ruscica</u>.
    timeline: 2025 - ongoing
    funding: UTSC PIE Fund, UTSC Global Learning Fund
    post: https://www.utsc.utoronto.ca/labs/immersive-tech/research/
    description: A configurable VR farm landscape whose crops, wilting, fungal infection, rain and flooding respond to underlying data. One shared base environment supports three student projects, covering heavy-metal soil contamination, crop uptake and aerogel mitigation, and the impact of climate on crop production.
